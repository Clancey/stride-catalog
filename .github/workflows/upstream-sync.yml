name: Sync upstream releases

# Keeps catalog entries whose upstream publishes its own APK on GitHub Releases current, so a
# console picks up a new Jellyfin the way it picks up a new Stride: on its next check, with nobody
# at a laptop. Everything this run is allowed to do is bounded by upstream.json - it cannot add an
# app, and it cannot change a pinned signing certificate. See tools/sync-upstream.sh.

on:
  schedule:
    # Daily. Upstream releases land far less often than that, and a check is one API call plus a
    # download only when something actually moved.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Only sync this package (default: all sources)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put build-tools on PATH
        # aapt2 and apksigner read the package, versionCode and signing certificate out of the APK.
        # They ship inside the SDK the runner image already has, but never on PATH.
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -x "$bt/aapt2" || { echo "no build-tools in $ANDROID_HOME"; exit 1; }
          echo "$bt" >> "$GITHUB_PATH"

      - name: Sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/sync-upstream.sh ${{ inputs.package }}

      - name: What moved
        id: moved
        run: |
          if git diff --quiet -- catalog.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, subprocess
          before = json.loads(subprocess.run(
              ["git", "show", "HEAD:catalog.json"],
              capture_output=True, text=True, check=True).stdout)
          after = json.load(open("catalog.json"))
          old = {a["package"]: a.get("versionCode") for a in before.get("apps", [])}
          moved = [a for a in after.get("apps", [])
                   if old.get(a["package"]) != a.get("versionCode")]
          with open("/tmp/moved.tsv", "w") as handle:
              for app in moved:
                  handle.write("\t".join([app["package"], app["url"],
                                          str(app["sizeBytes"]), app["sha256"]]) + "\n")
          with open("/tmp/summary.txt", "w") as handle:
              handle.write(", ".join("%s %s (%s)" % (a["name"], a["versionName"], a["versionCode"])
                                     for a in moved))
          PY

      - name: Verify what changed
        if: steps.moved.outputs.changed == '1'
        # Only the entries this run touched, fetched from the public internet with no credentials,
        # exactly as a console would. A full tools/verify.sh downloads every artifact in the
        # catalog - hundreds of megabytes of other people's apps that nothing here altered.
        run: |
          while IFS=$'\t' read -r package url size sha; do
            [ -n "$package" ] || continue
            echo "$package $url"
            tmp="$(mktemp)"
            curl -fsSL --max-time 900 -o "$tmp" "$url"
            got_size="$(wc -c <"$tmp" | tr -d ' ')"
            got_sha="$(sha256sum "$tmp" | cut -d' ' -f1)"
            rm -f "$tmp"
            [ "$got_size" = "$size" ] || { echo "  FAIL size: catalog $size, served $got_size"; exit 1; }
            [ "$got_sha" = "$sha" ] || { echo "  FAIL sha256: catalog $sha, served $got_sha"; exit 1; }
            echo "  ok $got_size bytes, sha256 matches"
          done < /tmp/moved.tsv

      - name: Commit
        if: steps.moved.outputs.changed == '1'
        # The commit is the publish. Nothing reaches a console until catalog.json lands on main.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Publish $(cat /tmp/summary.txt) from upstream"
          git push
